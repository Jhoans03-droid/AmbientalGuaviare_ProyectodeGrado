<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reportes ambientales | Ambiental Guaviare</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/estilos.css">

</head>


<body>


<!-- =========================
     BARRA SUPERIOR
========================= -->

<nav class="navbar navbar-expand-lg navbar-dark navbar-reportes">

    <div class="container">

        <a class="navbar-brand d-flex align-items-center"
           href="dashboard.html">

            <i class="bi bi-tree-fill"></i>

            <span>Ambiental Guaviare</span>

        </a>


        <a href="dashboard.html"
           class="btn btn-light btn-sm btn-volver">

            <i class="bi bi-arrow-left me-1"></i>

            Volver al panel

        </a>

    </div>

</nav>



<!-- =========================
     CONTENIDO PRINCIPAL
========================= -->

<main class="container reportes-container py-5">


    <!-- ENCABEZADO -->

    <div class="page-header">

        <div class="d-flex align-items-center">

            <div class="titulo-icono">

                <i class="bi bi-clipboard-data"></i>

            </div>

            <div>

                <h1>Consulta de reportes</h1>

                <p>
                    Consulte y filtre los reportes ambientales
                    registrados en la plataforma.
                </p>

            </div>

        </div>

    </div>



    <!-- =========================
         FILTROS
    ========================= -->

    <div class="filtros-card">

        <div class="row g-3">


            <!-- BÚSQUEDA -->

            <div class="col-md-7">

                <label for="busqueda"
                       class="filtro-label">

                    Buscar reporte

                </label>


                <div class="campo-con-icono">

                    <i class="bi bi-search"></i>

                    <input
                        id="busqueda"
                        type="text"
                        class="form-control campo-filtro"
                        placeholder="Buscar por título o categoría..."
                        autocomplete="off">

                </div>

            </div>



            <!-- ESTADO -->

            <div class="col-md-5">

                <label for="filtroEstado"
                       class="filtro-label">

                    Estado del reporte

                </label>


                <select
                    id="filtroEstado"
                    class="form-select select-filtro">

                    <option value="">
                        Todos los estados
                    </option>

                    <option value="REGISTRADO">
                        Registrado
                    </option>

                    <option value="EN_REVISION">
                        En revisión
                    </option>

                    <option value="INFORMACION_COMPLEMENTARIA">
                        Información complementaria
                    </option>

                    <option value="VERIFICADO">
                        Verificado
                    </option>

                    <option value="CERRADO">
                        Cerrado
                    </option>

                </select>

            </div>

        </div>

    </div>



    <!-- =========================
         ENCABEZADO RESULTADOS
    ========================= -->

    <div class="resultados-header">

        <h5>

            <i class="bi bi-list-ul me-2"></i>

            Reportes registrados

        </h5>

        <span class="resultados-info">
            Consulte la información disponible
        </span>

    </div>



    <!-- =========================
         LISTA DE REPORTES
    ========================= -->

    <div id="listaReportes">

        <div class="estado-vacio">

            <div class="estado-vacio-icono">

                <i class="bi bi-hourglass-split"></i>

            </div>

            <h5>Cargando reportes...</h5>

            <p>
                Estamos consultando la información disponible.
            </p>

        </div>

    </div>


</main>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- JavaScript de la aplicación -->

<script src="js/api.js"></script>

<script src="js/listado.js"></script>


</body>

</html>
